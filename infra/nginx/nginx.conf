events {
  worker_connections 1024;
}

http {
  # ─── Upstream Services ───────────────────────────────────────────
  upstream api {
    server api:3001;
  }

  upstream web {
    server web:3000;
  }

  # ─── Rate Limiting ───────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  # ─── Gzip ────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;
  gzip_min_length 1000;

  # ─── Main Server ─────────────────────────────────────────────────
  # This handles all traffic in local dev (no subdomain SSL needed)
  server {
    listen 80;
    server_name localhost *.localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # API routes
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth rate limit
    location /api/v1/auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket
    location /kitchen {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }

    # Swagger docs
    location /api/docs {
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    # QR redirect handler
    location /qr/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }

    # All other routes → Next.js web
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }

  # ─── Production: Wildcard Subdomain Support ───────────────────────
  # Uncomment and configure for production with wildcard SSL
  # server {
  #   listen 443 ssl;
  #   server_name ~^(?<slug>.+)\.platform\.com$;
  #   ssl_certificate /etc/nginx/ssl/wildcard.crt;
  #   ssl_certificate_key /etc/nginx/ssl/wildcard.key;
  #
  #   location /api/ {
  #     proxy_pass http://api;
  #     proxy_set_header X-Restaurant-Slug $slug;
  #     proxy_set_header Host $host;
  #   }
  #
  #   location / {
  #     proxy_pass http://web;
  #     proxy_set_header X-Restaurant-Slug $slug;
  #     proxy_set_header Host $host;
  #   }
  # }
}
